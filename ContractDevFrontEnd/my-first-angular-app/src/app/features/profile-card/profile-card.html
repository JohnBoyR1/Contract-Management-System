<div class="bg-light complete-user">
    <div class="container py-5">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-lg-3 border-end">
                <div class="p-4">
                    <div class="navbar-nav flex-column nav-pills">
                        <a class="nav-link" routerLink="/user-profile" routerLinkActive="active">
                            <i class="fas fa-user me-2"></i>Personal Info
                        </a>

                        <a class="nav-link" href="javascript:void(0)">
                            <i class="fas fa-lock me-2"></i>Security
                        </a>

                        <a class="nav-link" href="javascript:void(0)">
                            <i class="fas fa-bell me-2"></i>Notifications
                        </a>

                        <a class="nav-link" routerLink="/billing-details" routerLinkActive="active">
                            <i class="fas fa-credit-card me-2"></i>Billing
                        </a>

                        <a class="nav-link" routerLink="/profile-card" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                            <i class="fas fa-chart-line me-2"></i>Profile Card
                        </a>
                    </div>
                </div>
            </div>
            <!--Profile-Card-->
            <div class="col-9">
                <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                    <div class="card-body p-2">
                        <div class="row">
                            <!-- Profile Header -->
                            <div class="col-12 mb-4">
                                <div class="profile-header position-relative mb-4">
                                    <!--removing edit button--
                                    <div class="position-absolute top-0 end-0 p-3">
                                        <button class="btn btn-light"><i class="fas fa-edit me-2"></i>Edit Cover</button>
                                    </div>-->
                                </div>
                                <div class="text-center">
                                    <div class="position-relative d-inline-block">
                                        <img [src]="profile.profileImageUrl()" class="rounded-circle profile-pic" [class]="workStatus()" alt="Profile Picture">
                                       <!--- <button class="btn btn-primary btn-sm position-absolute bottom-0 end-0 rounded-circle">
                                            <i class="fas fa-camera"></i>
                                        </button>-->
                                    </div>
                                    <!--profile name under profile picture-->
                                    <h3 class="mt-3 mb-1 dispalyName">{{ isdisplayUserName() }}</h3>
                                    <p class="text-muted mb-3">{{ this.profile.userTitle() }}</p>
                                    <div class="d-flex justify-content-center gap-2 mb-4">
                                        <button class="btn btn-outline-primary" (click)="openChat()"  ><i class="fas fa-envelope me-2" ></i>Message</button>
                                        <button class="btn btn-primary"><i class="fas fa-user-plus me-2"></i>Add Favourite</button>
                                    </div>
                                    <!-- Register buttons -->
                                    <div class="text-center">
                                        <button  type="button" data-mdb-button-init data-mdb-ripple-init class="btn btn-link btn-floating mx-1">
                                        <i class="fab fa-facebook-f"></i>
                                        </button>

                                        <button  type="button" data-mdb-button-init data-mdb-ripple-init class="btn btn-link btn-floating mx-1">
                                        <i class="fab fa-google"></i>
                                        </button>

                                        <button  type="button" data-mdb-button-init data-mdb-ripple-init class="btn btn-link btn-floating mx-1">
                                        <i class="fab fa-twitter"></i>
                                        </button>

                                        <button  type="button" data-mdb-button-init data-mdb-ripple-init class="btn btn-link btn-floating mx-1">
                                        <i class="fab fa-github"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div class="mb-4">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Email</label>
                                        <input readonly type="email" class="form-control" value="{{ displayEmail() }}">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Phone</label>
                                        <input readonly type="tel" class="form-control phoneNumber"  value="{{ isPhoneDisplay() }}">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">Bio</label>
                                        <textarea class="form-control" rows="4" readonly>{{ displayBio() }}</textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>           
        </div>
    </div>
</div>
