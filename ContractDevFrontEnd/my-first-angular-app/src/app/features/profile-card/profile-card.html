
<app-profile-skills-modal [user]="getProfile()"></app-profile-skills-modal>
    
<div class="bg-light complete-user">
    <div class="container py-5">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-lg-3 border-end">
                <div class="p-4">
                    <div class="navbar-nav flex-column nav-pills">
                        <a class="nav-link" routerLink="/user-profile" routerLinkActive="active">
                            <i class="fas fa-user me-2"></i>Personal Info
                        </a>

                        <a class="nav-link" routerLink="/userProfileSecurity" routerLinkActive="active">
                            <i class="fas fa-lock me-2"></i>Security
                        </a>

                        <a class="nav-link" routerLink="/social-media-links" routerLinkActive="active">
                            <i class="fas fa-bell me-2"></i>Social Media Links
                        </a>

                        <!--<a class="nav-link" routerLink="/billing-details" routerLinkActive="active">
                            <i class="fas fa-credit-card me-2"></i>Billing
                        </a>-->

                        <a class="nav-link" routerLink="/profile-card" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                            <i class="fas fa-chart-line me-2"></i>Profile Card
                        </a>
                    </div>
                </div>
            </div>
            <!--Profile-Card-->
            <div class="col-9">
                <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                    <div class="card-body p-2">
                        <div class="row">
                            <!-- Profile Header -->
                            <div class="col-12 mb-4">
                                <div class="profile-header position-relative mb-4">
                                   
                                </div>
                                <div class="text-center">
                                    <div class="position-relative d-inline-block">
                                        <img [src]="profile.profileImageUrl()" 
                                        class="rounded-circle 
                                        profile-pic" 
                                        [class]="workStatus()" 
                                        alt="Profile Picture"
                                        matTooltip={{workStatusTooltip()}} 
                                        matTooltipPosition="below"
                                        >
                                    </div>
                                    <!--profile name under profile picture-->
                                    <h3 class="mt-3 mb-1 dispalyName">{{ isdisplayUserName() }}</h3>
                                    <p class="text-muted mb-3">{{ this.profile.userTitle() }}</p>
                                    <div class="d-flex justify-content-center gap-2 mb-4">
                                        <button class="btn btn-outline-primary"
                                        matTooltip="Send a direct message" 
                                        matTooltipPosition="below"
                                        (click)="openChat()"
                                        >
                                        <i class="fas fa-envelope me-2"></i>Message
                                        </button>
                                        <button class="btn btn-primary"
                                        matTooltip="Ratings, 'experience with user'" 
                                        matTooltipPosition="below"
                                        >
                                        <i class="bi bi-stars"></i>Add Ratings
                                        </button>
                                    </div>
                                    <!-- Register buttons -->
                                     <div class="text-center">
                                    <button type="button"
                                            class="btn btn-link btn-floating mx-1"
                                            matTooltip="Open Facebook" 
                                            matTooltipPosition="below"
                                            (click)="openLink('facebook')">
                                        <i class="fab fa-facebook-f"></i>
                                    </button>

                                    <button type="button"
                                            class="btn btn-link btn-floating mx-1"
                                            matTooltip="Open Social Email" 
                                            matTooltipPosition="below"
                                            (click)="openLink('Social Email')">
                                        <i class="bi bi-envelope-at"></i>
                                    </button>

                                    <button type="button"
                                            class="btn btn-link btn-floating mx-1"                
                                            matTooltip="Open X Profile" 
                                            matTooltipPosition="below"
                                            (click)="openLink('X')">
                                        <i class="bi bi-twitter-x"></i>
                                    </button>

                                    <button type="button"
                                            class="btn btn-link btn-floating mx-1"
                                            matTooltip="Open GitHub" 
                                            matTooltipPosition="below"
                                            (click)="openLink('Github')">
                                        <i class="fab fa-github"></i>
                                    </button>

                                    <button type="button"
                                            class="btn btn-link btn-floating mx-1"
                                            matTooltip="Open LinkedIn" 
                                            matTooltipPosition="below"
                                            (click)="openLink('LinkedIn')">
                                        <i class="bi bi-linkedin"></i>
                                    </button>

                                    <button type="button"
                                            class="btn btn-link btn-floating mx-1"
                                            matTooltip="View Profile Skills" 
                                            matTooltipPosition="below"
                                            [attr.data-bs-target]="'#skills-modal-' + this.profile.userId()"
                                            data-bs-toggle="modal"
                                            >
                                        <i class="bi bi-tools"></i>
                                    </button>
                                    </div>
                                </div>        
                            </div>    
                            <div class="mb-4">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Email</label>
                                        <input readonly type="email" class="form-control" value="{{ displayEmail() }}">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Phone</label>
                                        <input readonly type="tel" class="form-control phoneNumber"  value="{{ isPhoneDisplay() }}">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">Bio</label>
                                        <textarea class="form-control" rows="4" readonly>{{ displayBio() }}</textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>           
        </div>
    </div>
</div>
