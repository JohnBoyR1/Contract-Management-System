@if(uiService.isSearching()){
  <div class="container mt-5">
  <div class="row g-3">
    @for (u of filteredProfiles(); track u.userId) {
      <div class="col-md-6">
        <app-profile-display-card [user]="u"></app-profile-display-card>
      </div>
    } 
     </div>
  </div>

}@else{
  <div class="container mt-5">
  <div class="row g-3">

    @for (u of profiles(); track u.userId) {
      <div class="col-md-6">
        <app-profile-display-card [user]="u"></app-profile-display-card>
      </div>
    }

  </div>
</div>
}
