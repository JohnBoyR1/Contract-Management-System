<!-- Section: Design Block -->
<section class="entire text-center text-lg-start">
 
  <!-- Jumbotron -->
  <div class="container py-4">
    <div class="row g-0 align-items-center">
      <div class="col-lg-6 mb-5 mb-lg-0">
        <div class="card cascading-right bg-body-tertiary">
          <div class="card-body p-5 shadow-5 text-center">
            <h2 class="fw-bold mb-5">Log In</h2>
              <form [formGroup]="loginForm" (ngSubmit)="handleLogin()">
                <!--verify a valid form has been sent banner pop up-->
                @if (loggedIn()) {
                    <div class="alert alert-success mt-3">
                        <strong>Success!</strong> You are logged in.
                    </div>
                }
                <!-- Email input -->
                <div data-mdb-input-init class="form-outline mb-4">
                  <input formControlName="email" type="email" id="form3Example3" class="form-control" />
                  <label class="form-label" for="form3Example3">Email address</label>
                </div>

                <!-- Password input -->
                <div data-mdb-input-init class="form-outline mb-4">
                  <input formControlName="password" type="password" id="form3Example4" class="form-control" />
                  <label class="form-label" for="form3Example4">Password</label>
                </div>

                <!-- Checkbox -->
                <div class="form-check d-flex justify-content-center mb-4">
                  <input class="form-check-input me-2" type="checkbox" value="" id="form2Example33" checked />
                  <label class="form-check-label" for="form2Example33">
                    Subscribe to our newsletter
                  </label>
                </div>

                <!-- Submit button -->
                <button type="submit" data-mdb-button-init data-mdb-ripple-init class="login-btn btn btn-primary btn-block mb-4">
                  Log In
                </button>

                <!-- Register buttons -->
                <div class="text-center">
                  <p>or log in with:</p>
                  <button  type="button" data-mdb-button-init data-mdb-ripple-init class="btn btn-link btn-floating mx-1">
                    <i class="fab fa-facebook-f"></i>
                  </button>

                  <button  type="button" data-mdb-button-init data-mdb-ripple-init class="btn btn-link btn-floating mx-1">
                    <i class="fab fa-google"></i>
                  </button>

                  <button  type="button" data-mdb-button-init data-mdb-ripple-init class="btn btn-link btn-floating mx-1">
                    <i class="fab fa-twitter"></i>
                  </button>

                  <button  type="button" data-mdb-button-init data-mdb-ripple-init class="btn btn-link btn-floating mx-1">
                    <i class="fab fa-github"></i>
                  </button>
                </div>
              </form>
          </div>
        </div>
      </div>

      <div class="col-lg-6 mb-5 mb-lg-0">
        <img src="assets/images/rocket_computer.png" class="w-100 shadow-4 login-img"
          alt="" />
      </div>
    </div>
  </div> 
</section>
