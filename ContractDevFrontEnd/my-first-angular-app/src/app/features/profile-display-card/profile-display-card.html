<!--http://localhost:4200/profileDisplaycard-->
<div class="col-12 display-card" >
    <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
        <div class="card-body p-3">
            <div class="row">
                <!-- Profile Header -->
                <div class="col-12 mb-2 profile-card">
                    <div class="profile-header position-relative mb-4">
                        <!--profile cover abovet the profile picture-->
                    </div>
                    <div class="text-center">
                        <div class="position-relative d-inline-block">
                            <img [src]="profileImageUrl() ?? 'assets/default.jpg'" class="rounded-circle profile-pic" [class]="workStatus()" alt="Profile Picture">
                        </div>
                        <!--profile name under profile picture-->
                        <h3 class="mt-3 mb-1 dispalyName">{{ displayUserNameProfile() }}</h3>
                        <p class="text-muted mb-3">{{ user.userTitle }}</p>
                        <div class="d-flex justify-content-center gap-2 mb-4">
                            <button class="btn btn-outline-primary" (click)="openChat()"  ><i class="fas fa-envelope me-2" ></i>Message</button>
                            <button class="btn btn-primary"><i class="fas fa-user-plus me-2"></i>Add Favourite</button>
                        </div>
                        <!-- Register buttons -->
                        <div class="text-center">
                            <button  type="button" data-mdb-button-init data-mdb-ripple-init class="btn btn-link btn-floating mx-1">
                            <i class="fab fa-facebook-f"></i>
                            </button>

                            <button  type="button" data-mdb-button-init data-mdb-ripple-init class="btn btn-link btn-floating mx-1">
                            <i class="fab fa-google"></i>
                            </button>

                            <button  type="button" data-mdb-button-init data-mdb-ripple-init class="btn btn-link btn-floating mx-1">
                            <i class="fab fa-twitter"></i>
                            </button>

                            <button  type="button" data-mdb-button-init data-mdb-ripple-init class="btn btn-link btn-floating mx-1">
                            <i class="fab fa-github"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="mb-4">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input readonly type="email" class="form-control" value="{{ user.email }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone</label>
                            <input readonly type="tel" class="form-control phoneNumber"  value="{{ displayPhoneNumber() }}">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Bio</label>
                            <textarea class="form-control" rows="4" readonly>{{ user.bio }}</textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
