<app-carousel></app-carousel>
<main class="main">
    <div class="content">
        <div class="how row mt-5">
            
            <div class="col-xl-6 next">
                <img class="img d-block w-100" src="assets/images/pic_dev.png" alt="">
            </div>
            <div class="col-xl-6">
                <div class="card">
                    <div class="card-header">
                        Quote
                    </div>
                    <div class="card-body">
                        <figure>
                        <blockquote class="blockquote">
                            <p>A well-known quote, contained in a blockquote element.</p>
                            <p>{{count()}}</p>
                            <button class="login-btn btn btn-primary btn-block mb-4"  (click)="increase()">Add 1</button>
                        </blockquote>
                        <figcaption class="blockquote-footer">
                            Someone famous in <cite title="Source Title">Source Title</cite>
                        </figcaption>
                        </figure>
                        <!--card animated-->
                            <div class="box"  style="min-height: 100px; border: 1px solid black;">
                                <div style="max-width: 300px">
                                    <div class="card collapse-card" style="width: 300px">
                                        <div class="card-body">You can collapse horizontally this card by clicking Toggle~~~~~~~~~~~~~~~~~~~~~~~~~
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="position-relative text-center">
                <img  class="img-fluid" alt="...">

                <div class="position-absolute top-50 start-50 translate-middle text-white">
                    <h1 class="fw-bold">Your Title Here</h1>
                    <p class="lead">Your subtitle or description</p>
                </div>
            </div>    
        </div>
    </div>
</main>
