<!--NOTE: User-to-user messaging is not functioning with the current backend/RDS/cloud integration.-->
<div class="chat-overlay" >
  <div class="chat-container chat-container" (click)="$event.stopPropagation()">
    
    <div class="chat-header">
      <h4 class="chat-heading">Chat</h4>
      <button class="close-btn" (click)="closeChat()">×</button>
    </div>

    <div class="chat-body">
      <app-message-list [messages]="store.messages()"></app-message-list>
      <a class="clear-chat-btn" (click)="store.clearHistory()"><i>Clear Chat</i></a>
    </div>

    <div class="chat-footer">
      <app-message-input (send)="handleSend($event)"></app-message-input>
    </div>
  </div>
</div>
