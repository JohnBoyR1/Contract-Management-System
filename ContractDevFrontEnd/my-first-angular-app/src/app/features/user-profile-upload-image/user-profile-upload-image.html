<div class="bg-light complete-user">
  <div class="container py-5">
    <div class="row">
      <!-- Profile Header -->
      <div class="col-12 mb-4">
        <div class="profile-header position-relative mb-4">
        </div>
        <div class="text-center">
          <div class="position-relative d-inline-block">
            <img
              [src]="profile.profileImageUrl()"
              class="rounded-circle profile-pic"
              alt="Profile Picture"
            />
            
          </div>
          <h3 class="mt-3 mb-1">{{ nameDisplay() }}</h3>
          <p class="text-muted mb-3">{{ this.profile.userTitle() }}</p>
           <div class="d-flex justify-content-center gap-2 mb-4">
              <button class="btn btn-outline-primary"
              matTooltip="Send a direct message" 
              matTooltipPosition="below"
              >
              <i class="fas fa-envelope me-2"></i>Message
              </button>
              <button class="btn btn-primary"
              matTooltip="Ratings, 'experience with user'" 
              matTooltipPosition="below"
              >
              <i class="bi bi-stars"></i>Add Ratings
              </button>
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="col-12">
        <div class="card border-0 shadow-sm">
          <div class="card-body p-0">
            <div class="row g-0">
              <!-- Sidebar -->
              <div class="col-lg-3 border-end">
                <div class="p-4">
                  <div class="navbar-nav flex-column nav-pills">
                    <a class="nav-link"
                     routerLink="/user-profile" 
                     routerLinkActive="active"
                     matTooltip="View personal details"
                     matTooltipPosition="below"
                     >
                      <i class="fas fa-user me-2"></i>Personal Info
                    </a>

                    <a class="nav-link"
                     routerLink="/userProfileSecurity" 
                     routerLinkActive="active"
                     matTooltip="Password reset and account deletion" 
                     matTooltipPosition="below"
                     >
                      <i class="fas fa-lock me-2"></i>Security
                    </a>

                    <a class="nav-link" 
                    routerLink="/social-media-links" 
                    routerLinkActive="active"
                    matTooltip="Manage your social links" 
                    matTooltipPosition="below"
                    >
                      <i class="fas fa-bell me-2"></i>Social Media Links
                    </a>

                    <!--<a class="nav-link" routerLink="/billing-details" routerLinkActive="active">
                      <i class="fas fa-credit-card me-2"></i>Billing
                    </a> for future use-->

                    <a class="nav-link" 
                    routerLink="/profile-card" 
                    routerLinkActive="active"
                    matTooltip="View your public profile card" 
                    matTooltipPosition="below"
                    >
                      <i class="fas fa-chart-line me-2"></i>Profile Card
                    </a>
                  </div>
                </div>
              </div>
              <!-- Content Area -->
              <div class="col-lg-9">
                <!-- update profile -->
                <form  >
                    <div class="p-4">
                        <!-- Personal Information -->
                        <div class="mb-4">
                           
                            <div class="row g-3">
                                <div class="col-md-12">
                                
                                <h5 class="mb-4">Profile Picture</h5>
                                    <app-file-upload></app-file-upload>
                                </div>
                        
                            </div>
                        </div> 
                    </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
