
<app-gdpr-modal [showButtons]="false"></app-gdpr-modal>


<div class="container py-4">
    

    <div class="content row image-meeting" (click)="showVideoOn()">
        
        @if(showVideo()){
            
           <video class="multi-cards bottom-video  w-100 ideas_img" autoplay muted (ended)="onVideoEnding()"  >
                <source  type="video/mp4" src="assets/videos/software_dev_video.mp4">
            </video>
        }
        @else { 
            
            <img src="assets/images/black_board_dev.png" alt=" a man standing with his back towards the user looking at a blackboard with many ideas or directions regarding 'devops'"  class="ideas_img"
            matTooltip="Click to play the video"
            matTooltipPosition="below"/>
            
        }
        
    </div>
    <div class="content row  mt-5 ">
        <div class="col-12 image-meeting"  (click)=" toggleAboutText()">
            <img src="assets/images/ideas_meeting.png" alt="5 people sitting around table descussing idea"  class="ideas_img"
            matTooltip="Click View About Details"
            matTooltipPosition="below"/>
            @if (showAboutText()) {
                <div #aboutSection class="about-overlay">
                    <app-about-text></app-about-text>
                </div>
            }
        </div>   
    </div>
    <div class="row mt-5">
        <div class="col-sm-6 image-meeting" (click)="onShowGdpr()">
            <img src="assets/images/devops_manager.png"
                class="devops_manager_img"
                matTooltip="Click View About GDPR"
                matTooltipPosition="below"/>
        </div>
       
      
        <div class="col-sm-6">
            <img src="assets/images/man_city.png" alt="a man holding a mobile phone smiling with a city, large builings in the background"  class="man_city_img"/>
        </div>
    </div>
</div>
