<div class="bg-light complete-user">
  <div class="container py-5">
    <div class="row">
      <!-- Profile Header -->
      <div class="col-12 mb-4">
        <div class="profile-header position-relative mb-4">
          <div class="position-absolute top-0 end-0 p-3">
            <button class="btn btn-light"><i class="fas fa-edit me-2"></i>Edit Cover</button>
          </div>
        </div>
        <div class="text-center">
          <div class="position-relative d-inline-block">
            <img
              [src]="profile.profileImageUrl()"
              class="rounded-circle profile-pic"
              alt="Profile Picture"
            />
          </div>
          <h3 class="mt-3 mb-1">{{ nameDisplay() }}</h3>
          <p class="text-muted mb-3">{{ this.profile.userTitle() }}</p>
          <div class="d-flex justify-content-center gap-2 mb-4">
            <button class="btn btn-outline-primary">
              <i class="fas fa-envelope me-2"></i>Message
            </button>
            <button class="btn btn-primary">
              <i class="fas fa-user-plus me-2"></i>Add Favourite
            </button>
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="col-12">
        <div class="card border-0 shadow-sm">
          <div class="card-body p-0">
            <div class="row g-0">
              <!-- Sidebar -->
              <div class="col-lg-3 border-end">
                <div class="p-4">
                  <div class="navbar-nav flex-column nav-pills">
                    <a class="nav-link" routerLink="/user-profile" routerLinkActive="active">
                      <i class="fas fa-user me-2"></i>Personal Info
                    </a>

                    <a class="nav-link" routerLink="/userProfileSecurity" routerLinkActive="active">
                      <i class="fas fa-lock me-2"></i>Security
                    </a>

                    <a class="nav-link" routerLink="/userProfileDeletion" routerLinkActive="active">
                      <i class="fas fa-trash me-2"></i>Delete Account
                    </a>

                    <a class="nav-link" routerLink="/social-media-links" routerLinkActive="active">
                      <i class="fas fa-bell me-2"></i>Social Media Links
                    </a>

                    <!--<a class="nav-link" routerLink="/billing-details" routerLinkActive="active">
                      <i class="fas fa-credit-card me-2"></i>Billing
                    </a>-->

                    <a class="nav-link" routerLink="/profile-card" routerLinkActive="active">
                      <i class="fas fa-chart-line me-2"></i>Profile Card
                    </a>
                  </div>
                </div>
              </div>

              <!-- Content Area -->
              <div class="col-lg-9">
                <!-- update profile through form submission (submit button will call this)-->
                <form [formGroup]="deletionForm">
                  <div class="p-4">
                    <!-- Personal Information -->
                    <div class="mb-4">
                      <h5 class="mb-4">Delete Account</h5>
                      <div class="row g-3">
                        <div class="col-md-6">
                          <label class="form-label">Current Password</label>
                          <input
                            formControlName="currentPassword"
                            type="password"
                            class="form-control"
                            value=""
                          />
                        </div>
                       <!--Security Drop Down Questions-->
                        <div class="col-md-6 mx-auto">
                          <label class="form-label">Security Question</label>
                          <select class="form-select" formControlName="securityQuestion">
                            <option value="" disabled selected>Select a question</option>
                            @for (q of securityQuestions(); track $index) {
                              <option [value]="q">{{ q }}</option>
                            }
                          </select>
                        </div>
                        <!---->
                        <div class="col-md-6">
                          <label class="form-label">Security Questions: Answer</label>
                          <input
                            formControlName="securityAnswer"
                            type="text"
                            class="form-control"
                            value=""
                          />
                        </div>
                      </div>
                    </div>

                    <!-- Settings Cards -->
                    <div class="row g-4 mb-4">
                      <div class="col-md-6">
                        <div class="settings-card card">
                          <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                              <div>
                                <h6 class="mb-1">DELETE PROFILE</h6>
                                <p class="text-muted mb-0 small">
                                  Only if you want to delete your profile
                                </p>
                              </div>
                              <div>
                                <button type="button" class="btn btn-danger" (click)="openModal()">
                                  Delete
                                </button>
                                @if (isOpenDeleteModal()) {
                                  <div class="modal-backdrop"></div>

                                  <div class="modal-window">
                                    <h3>Confirm Delete</h3>
                                    <p>Are you sure?</p>

                                    <button class="btn btn-secondary" (click)="closeModal()">
                                      Cancel
                                    </button>
                                    <button class="btn btn-danger" (click)="confirmDelete()">
                                      Delete
                                    </button>
                                  </div>
                                }
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                      <!---- <div class="col-md-6">
                        <div class="settings-card card">
                          <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                              <div>
                                <h6 class="mb-1">Update Profile</h6>
                                <p class="text-muted mb-0 small">Only if you made changes</p>
                              </div>
                              <div>
                                <button type="button" class="btn btn-outline-primary" type="submit">
                                  Save
                                </button>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>---->
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
