<nav class="navbar fixed-top navbar-expand-lg">
  <img class="img ms-3" src="assets/images/contract_dev_final.png"  
             style="cursor: pointer;" 
             alt="Logo" width="100">
             

  <!--testing to see if I can get a hamburger menu working-->
  @if(this.authService.isLoggedIn){
  <div class="dropdown-menu-custom" [class.d-none]="!isBurgerMenuVisible">
    
    <a routerLink="/user-profile" (click)="isBurgerMenuVisible = false">Profile</a>
  </div>
  }
  <!--ensuring seperation-->

  <div class="collapse navbar-collapse" id="navbar">
    <ul class="navbar-nav me-auto mt-2 mt-lg-0">
      <li class="nav-item active">
        <a class="Home nav-link" matTooltip="Home: Go Home" matTooltipPosition="below" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true}"><i class="bi bi-house-fill icon me-2"></i></a>
      </li>
      <li class="nav-item">
        <a class="about nav-link" matTooltip="About: About Page" matTooltipPosition="below" routerLink="/about" routerLinkActive="active"><i class="bi bi-exclamation-square-fill icon me-2"></i></a>
      </li>
      @if(authService.isLoggedIn()){
      <li class="nav-item">
        <a class="gallery nav-link"  matTooltip="Gallery: Profile Gallery" matTooltipPosition="below" routerLink="/profileGallery" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true}"><i class="bi bi-file-earmark-richtext icon me-2"></i></a>
      </li>
      }
       @if(!authService.isLoggedIn()){
      <li class="nav-item">
        <a class="sign_up nav-link" matTooltip="Sign Up: Create Account" matTooltipPosition="below" routerLink="/sign-up" routerLinkActive="active"><i class="bi bi-pencil-square icon me-2"></i></a>
      </li>
      }
      @if(!authService.isLoggedIn()){ 
      <li class="nav-item">
        <a class="Login nav-link" matTooltip="Login: Sign In" matTooltipPosition="below" routerLink="/login" routerLinkActive="active"><i class="bi bi-door-open-fill icon me-2"></i></a>
      </li>
      }
      @if(authService.isLoggedIn()){
      <li class="nav-item">
        <a class="user-profile nav-link" matTooltip="User Profile: Your Profile" matTooltipPosition="below" routerLink="/user-profile" routerLinkActive="active"><i class="bi bi-person-gear icon me-2"></i></a>
      </li>
      }
      @if(authService.isLoggedIn()){
      <li class="nav-item">
        <a class="log_out nav-link" matTooltip="Logout: Sign Out" matTooltipPosition="below" (click)="toggleSignInAndOut()" ><i class="bi bi-x-circle icon me-2"></i></a>
      </li>
      }
      
    </ul>
    <form class="d-flex">
      <div class="form-check form-switch me-3">
        <input class="form-check-input darkModeSwitch" matTooltip="Dark Mode Toggle: Toggle Theme" matTooltipPosition="below"  type="checkbox" role="switch" id="flexSwitchCheckDefault" [checked]="darkMode()"
      (change)="toggleDarkMode()" >
        <label class="form-check-label me-2" matTooltip="Dark Mode Toggle: Toggle Theme" matTooltipPosition="below" for="flexSwitchCheckDefault"><i class="bi bi-lightbulb-off icon"></i></label>
      </div>
     
        <input class="form-control me-2" type="search" placeholder="Search">
      <button class="search btn btn-outline-success me-3" matTooltip="Search Button: Search" matTooltipPosition="below" type="submit"><i class="bi bi-search"></i></button>
    </form>
  </div>
</nav>
