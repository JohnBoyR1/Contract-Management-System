<div class="card p-3 shadow-sm">
  <h5 class="mb-3">Upload a file</h5>

  <div class="mb-3">
    <input type="file" class="form-control" (change)="onFileSelected($event)" />
  </div>

  @if (previewUrl) {
    <div class="mb-3">
      <img [src]="previewUrl" class="img-thumbnail" style="max-width: 200px" alt="File preview" />
    </div>
  }

  <button class="btn btn-primary" [disabled]="!selectedFile" (click)="upload()">Upload</button>
</div>
