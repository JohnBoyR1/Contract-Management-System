<!--seperate componet giving the ability for the user to upload a profile picture in this case, but can be used to upload other files-->

<!-- Card wrapper -->
<div class="card p-3 shadow-sm">
  <h5 class="mb-3">Upload a file</h5>

  <!-- File input -->
  <div class="mb-3">
    <input
      #fileInput
      type="file"
      class="form-control"
      accept="image/*"
      (change)="onFileSelected($event)"
    />
  </div>

  <!-- Action buttons -->
  <div class="row mt-2">
    <!-- Preview button -->
    <div class="col-6 d-grid">
      <button
        matTooltip="View Image before uploading"
        matTooltipPosition="below"
        type="button"
        class="btn btn-secondary"
        [disabled]="!selectedFile"
        (click)="showPreview()"
      >
        Preview
      </button>
    </div>

    <!-- Upload button -->
    <div class="col-6 d-grid text-end">
      <button
        matTooltip="Upload the Previewed Image"
        matTooltipPosition="below"
        type="button"
        class="btn btn-primary"
        [disabled]="!selectedFile"
        (click)="upload()"
      >
        Upload
      </button>
    </div>
  </div>

  <!-- Preview section -->
  @if (previewUrl) {
    <div class="mt-3 text-center position-relative d-inline-block">

      <!-- Delete (X) button -->
      <button
        matTooltip="Clear Preview"
        matTooltipPosition="below"
        type="button"
        class="btn btn-sm btn-danger position-absolute"
        style="top: -10px; right: -10px; border-radius: 50%; padding: 2px 6px;"
        (click)="clearPreview()"
      >
        ×
      </button>

      <!-- Image preview -->
      <img
        matTooltip="Preview Image"
        matTooltipPosition="below"
        [src]="previewUrl"
        class="img-thumbnail"
        style="max-width: 200px"
      />
    </div>
  }
</div>
